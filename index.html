<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Amazonas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-success">Amazonas Monitor</h1>
            <p class="lead text-muted">Datos climáticos reales via NASA API</p>
        </header>

        <main class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body text-center p-4">
                        <h5 class="card-title text-secondary">Temperatura Media Histórica</h5>
                        <h6 class="card-subtitle mb-3 text-muted">Centro del Amazonas (Lat -3.46, Lon -62.21)</h6>
                        
                        <div id="loader" class="spinner-border text-success my-3" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        
                        <h2 id="temp-value" class="display-2 fw-bold text-dark d-none">--°C</h2>
                        <p id="temp-desc" class="text-muted d-none">Promedio climatológico anual a 2 metros de altura</p>
                        
                        <div id="error-message" class="alert alert-danger d-none mt-3" role="alert"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="main.js"></script>
</body>
</html>
