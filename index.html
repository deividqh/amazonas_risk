<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Amazonas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="hero text-center">
            <p class="hero-kicker">Monitoreo climático</p>
            <h1 class="hero-title">Temperatura del Amazonas</h1>
            <p class="hero-subtitle">Dato climatológico anual de la NASA para el corazón de la selva.</p>
        </header>

        <main class="temperature-panel" aria-live="polite">
            <div id="loader" class="loader" role="status">
                <span class="loader-dot"></span>
                <span>Cargando lectura...</span>
            </div>

            <div id="temperature-content" class="d-none">
                <p class="location">Lat -3.46 · Lon -62.21</p>
                <div id="temp-orb" class="temp-orb" aria-hidden="true"></div>
                <h2 id="temp-value" class="temperature-value">--°C</h2>
                <p id="temp-label" class="temperature-label">Estado térmico</p>
                <p id="temp-desc" class="temperature-description">Promedio climatológico anual a 2 metros de altura.</p>
            </div>

            <div id="error-message" class="error-message d-none" role="alert"></div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/acciones.js"></script>
    <script src="main.js"></script>
</body>
</html>
